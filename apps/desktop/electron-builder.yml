electronLanguages: ["en-US"]
appId: org.safemun2026.app
productName: SAFE MUN 2026
copyright: Copyright © SAFE MUN 2026
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - "!out/renderer/**/*"
  - "!node_modules/koffi/build/koffi/*"
extraResources:
  - from: out/renderer
    to: renderer
asarUnpack:
  - "**/node_modules/koffi/**"
compression: maximum
win:
  target:
    - portable
  artifactName: SAFE-MUN-2026-Setup-${version}.${ext}
  icon: build/icon.png
  files:
    - "node_modules/koffi/build/koffi/win32_${arch}/**/*"
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SAFE MUN 2026
mac:
  target:
    - dmg
  category: public.app-category.utilities
  artifactName: SAFE-MUN-2026-${version}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: build/icon.png
  files:
    - "node_modules/koffi/build/koffi/darwin_${arch}/**/*"
linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png
  files:
    - "node_modules/koffi/build/koffi/linux_${arch}/**/*"
publish: null
